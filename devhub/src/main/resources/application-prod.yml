# 生产 profile：安全默认值全部移除，缺失即启动失败（fail-fast），杜绝弱密钥静默上线
devhub:
  jwt:
    secret: ${DEVHUB_JWT_SECRET}          # 无默认值：未设置 → 启动报错
    ttl-hours: 24

spring:
  datasource:
    url: ${MYSQL_URL}                     # 形如 jdbc:mysql://host:3306/devhub?...
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
