<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevHub · 智能问答</title>
<!-- Markdown 渲染三件套（CDN，加载失败自动降级纯文本模式） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text2: #6e6e73;
    --accent: #0071e3;
    --accent-h: #0077ed;
    --bubble-ai: #f5f5f7;
    --bubble-user: #0071e3;
    --green: #1e7e34;
    --green-bg: #e8f5e9;
    --red: #ff3b30;
    --border: rgba(0, 0, 0, 0.08);
    --glass: rgba(255, 255, 255, 0.72);
    --input-border: #d2d2d7;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
    --scrollbar: #c7c7cc;
    --scrollbar-h: #aeaeb2;
    --thinking-bg: rgba(0, 113, 227, 0.05);
    --thinking-code-bg: rgba(0, 113, 227, 0.1);
    --code-bg: #0d1117;
    --code-head: #161b22;
  }
  :root[data-theme="dark"] {
    --bg: #161617;
    --card: #1e1e20;
    --text: #f5f5f7;
    --text2: #98989d;
    --accent: #0a84ff;
    --accent-h: #409cff;
    --bubble-ai: #2c2c2e;
    --bubble-user: #0a84ff;
    --green: #30d158;
    --green-bg: rgba(48, 209, 88, 0.14);
    --red: #ff453a;
    --border: rgba(255, 255, 255, 0.1);
    --glass: rgba(22, 22, 23, 0.72);
    --input-border: #3a3a3c;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    --scrollbar: #48484a;
    --scrollbar-h: #5a5a5e;
    --thinking-bg: rgba(10, 132, 255, 0.08);
    --thinking-code-bg: rgba(10, 132, 255, 0.14);
    --code-bg: #0d1117;
    --code-head: #161b22;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }

  svg.icon {
    width: 1em; height: 1em;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.125em; flex-shrink: 0;
  }

  /* ---------- 顶栏 ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 28px;
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, #0071e3, #42a5f5);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 18px; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.35);
  }
  .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
  .brand small { display: block; font-size: 11px; color: var(--text2); font-weight: 400; margin-top: 1px; }
  header select {
    padding: 8px 14px; border-radius: 980px; border: 1px solid var(--input-border);
    background: var(--card); color: var(--text);
    font-size: 13px; transition: all .2s ease; cursor: pointer;
  }
  header select:hover { border-color: var(--accent); }
  header input {
    width: 180px; padding: 8px 16px; border-radius: 980px; border: 1px solid var(--input-border);
    background: var(--card); color: var(--text);
    font-size: 13px; outline: none; transition: all .2s ease;
  }
  header input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12); }
  #themeToggle {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--input-border);
    background: var(--card); color: var(--text); font-size: 16px; cursor: pointer;
    transition: all .2s ease; display: flex; align-items: center; justify-content: center;
  }
  #themeToggle:hover { border-color: var(--accent); transform: rotate(15deg); }

  /* ---------- 主体 ---------- */
  .main { flex: 1; display: flex; gap: 16px; padding: 16px 20px; min-height: 0; }
  aside {
    width: 292px; flex-shrink: 0;
    background: var(--card); border-radius: 24px; box-shadow: var(--shadow);
    padding: 20px; overflow-y: auto;
    display: flex; flex-direction: column;
    transition: background .3s ease;
  }
  .panel { padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .panel h3 {
    font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.5px;
    margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
  }
  .panel h3 button {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 500; padding: 5px 13px;
    background: var(--accent); color: #fff; border: none; border-radius: 980px;
    cursor: pointer; transition: background .2s ease;
  }
  .panel h3 button:hover { background: var(--accent-h); }
  .panel h3 button svg.icon { font-size: 12px; }

  /* 知识库入口大按钮 */
  #kbBtn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 14px 16px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 18px;
    color: var(--text); font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: all .2s ease;
    margin-top: auto;
  }
  #kbBtn:hover { background: var(--thinking-code-bg); border-color: var(--accent); transform: translateY(-1px); }
  #kbBtn svg.icon { font-size: 20px; color: var(--accent); }
  #kbBtn .badge {
    margin-left: auto; min-width: 24px; height: 24px; padding: 0 8px;
    border-radius: 980px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }

  .conv-item {
    padding: 10px 14px; border-radius: 14px; cursor: pointer;
    font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 4px; transition: background .15s ease;
  }
  .conv-item:hover { background: var(--bg); }
  .conv-item.active { background: var(--thinking-code-bg); color: var(--accent); font-weight: 500; }

  /* ---------- 知识库抽屉 ---------- */
  .drawer-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.32);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .drawer-backdrop.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 51;
    width: min(440px, 94vw);
    background: var(--card);
    border-radius: 0 28px 28px 0;
    box-shadow: 24px 0 60px rgba(0, 0, 0, 0.2);
    transform: translateX(-102%);
    transition: transform .35s cubic-bezier(0.32, 0.72, 0, 1);
    display: flex; flex-direction: column;
    padding: 24px;
  }
  .drawer.show { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .drawer-head svg.icon { font-size: 22px; color: var(--accent); }
  .drawer-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; flex: 1; }
  .drawer-head .total { font-size: 12px; color: var(--text2); font-weight: 400; margin-left: 6px; }
  .closeBtn {
    width: 32px; height: 32px; border-radius: 50%;
    border: none; background: var(--bg); color: var(--text2);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; transition: all .2s ease;
  }
  .closeBtn:hover { background: var(--thinking-code-bg); color: var(--accent); }

  /* 拖拽上传区 */
  .dropzone {
    border: 1.5px dashed var(--input-border);
    border-radius: 18px; padding: 22px 16px;
    text-align: center; color: var(--text2); font-size: 13px; line-height: 1.7;
    cursor: pointer; transition: all .2s ease; margin-bottom: 16px;
    user-select: none;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent); background: var(--thinking-bg); color: var(--accent);
  }
  .dropzone svg.icon { font-size: 26px; display: block; margin: 0 auto 8px; }
  .dropzone strong { color: var(--accent); font-weight: 600; }
  .dropzone .types { font-size: 11px; color: var(--text2); }

  /* 文档列表 */
  .doc-list { flex: 1; overflow-y: auto; min-height: 0; }
  .doc-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 16px;
    background: var(--bg); margin-bottom: 8px;
    transition: transform .15s ease;
  }
  .doc-row:hover { transform: translateY(-1px); }
  .doc-row .ficon {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    background: var(--thinking-code-bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .doc-row .info { flex: 1; min-width: 0; }
  .doc-row .name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-row .meta { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .doc-row .del {
    border: none; background: none; color: var(--red); cursor: pointer;
    padding: 6px; border-radius: 9px; font-size: 14px;
    display: flex; align-items: center; transition: background .15s ease;
  }
  .doc-row .del:hover { background: rgba(255, 59, 48, 0.1); }
  .doc-row .del svg.icon { font-size: 14px; }

  /* 分页器 */
  .pager {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding-top: 14px; flex-wrap: wrap;
  }
  .pg-btn {
    min-width: 32px; height: 32px; padding: 0 8px;
    border-radius: 10px; border: none;
    background: var(--bg); color: var(--text);
    font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s ease;
  }
  .pg-btn:hover:not(:disabled):not(.active) { background: var(--thinking-code-bg); color: var(--accent); }
  .pg-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
  .pg-btn:disabled { opacity: 0.35; cursor: default; }
  .pg-btn.nav svg.icon { font-size: 15px; }
  .pg-dots { color: var(--text2); font-size: 13px; padding: 0 2px; }
  .pg-jump {
    display: flex; align-items: center; gap: 6px;
    margin-left: 10px; font-size: 12px; color: var(--text2);
  }
  .pg-jump input {
    width: 52px; padding: 6px 8px; text-align: center;
    border: 1px solid var(--input-border); border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 12px; font-family: inherit;
    outline: none;
  }
  .pg-jump input:focus { border-color: var(--accent); }
  .pg-jump button {
    padding: 6px 12px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 12px; font-family: inherit;
    cursor: pointer; transition: background .2s ease;
  }
  .pg-jump button:hover { background: var(--accent-h); }

  /* 知识缺口面板 */
.gap-panel {
  background: rgba(255, 149, 0, 0.07);
  border: 0.5px solid rgba(255, 149, 0, 0.25);
  border-radius: 16px; padding: 12px 14px; margin-bottom: 14px;
}
.gap-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; font-size: 12.5px; color: var(--text);
  border-top: 0.5px solid var(--border);
}
.gap-row:first-of-type { border-top: none; }
.gap-row .q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gap-row .cnt { font-size: 11px; color: #ff9500; font-weight: 600; flex-shrink: 0; }
.gap-row button {
  flex-shrink: 0; border: none; border-radius: 980px; cursor: pointer;
  padding: 4px 12px; font-size: 11px; font-family: inherit;
  background: var(--accent); color: #fff; transition: background .2s ease;
}
.gap-row button:hover { background: var(--accent-h); }
.gap-row button:disabled { background: var(--scrollbar); }

/* 文档状态徽章与审核 */
.life-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 600; padding: 2px 8px;
  border-radius: 980px; flex-shrink: 0; margin-left: 6px;
}
.life-draft { background: rgba(255,149,0,.15); color: #ff9500; }
.life-superseded { background: var(--bg); color: var(--text2); }
.life-disabled { background: rgba(255,59,48,.12); color: var(--red); }
.life-retired { background: var(--bg); color: var(--text2); }
.life-conflict { background: rgba(255,59,48,.12); color: var(--red); }
.doc-row .review-btns { display: flex; gap: 4px; }
.doc-row .review-btns button {
  border: none; cursor: pointer; border-radius: 8px; font-size: 11px;
  font-family: inherit; padding: 4px 10px; transition: all .15s ease;
}
.doc-row .review-btns .ok { background: var(--green-bg); color: var(--green); }
.doc-row .review-btns .no { background: rgba(255,59,48,.1); color: var(--red); }
.doc-row .review-btns button:hover { filter: brightness(0.92); }

/* 出处反馈按钮 */
.sources .fb {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  border: none; cursor: pointer; background: transparent; color: var(--text2);
  margin: 0 4px 6px 0; transition: all .15s ease;
}
.sources .fb:hover { background: var(--bg); }
.sources .fb.done { color: var(--green); }
.sources .fb.bad:hover { color: var(--red); }
.sources .fb svg.icon { font-size: 13px; }

/* ---------- 聊天区（Claude 式文档排版） ---------- */
  #chatArea {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: var(--card); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden;
    transition: background .3s ease;
  }
  #messages { flex: 1; overflow-y: auto; padding: 32px 24px; }
  .msg { max-width: 760px; margin: 0 auto 22px; display: flex; flex-direction: column; }

  /* 用户消息：右侧小气泡 */
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--bubble-user); color: #fff;
    border-radius: 20px 20px 6px 20px;
    padding: 10px 16px; font-size: 15px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; max-width: 78%;
    box-shadow: 0 4px 14px rgba(0, 113, 227, 0.22);
  }

  /* AI 消息：全宽文档式（无气泡），Markdown 富排版 */
  .msg.ai { align-items: stretch; position: relative; }
  .msg.ai .bubble {
    font-size: 15px; line-height: 1.75; color: var(--text);
    max-width: 100%; word-break: break-word;
  }
  .md-plain { white-space: pre-wrap; }

  /* Markdown 元素样式 */
  .md-body p { margin: 0 0 10px; }
  .md-body p:last-child { margin-bottom: 0; }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4 {
    margin: 18px 0 8px; letter-spacing: -0.3px; line-height: 1.4;
  }
  .md-body h1 { font-size: 20px; } .md-body h2 { font-size: 18px; }
  .md-body h3 { font-size: 16px; } .md-body h4 { font-size: 15px; }
  .md-body ul, .md-body ol { margin: 0 0 10px; padding-left: 24px; }
  .md-body li { margin: 4px 0; }
  .md-body blockquote {
    border-left: 3px solid var(--accent); background: var(--thinking-bg);
    padding: 8px 14px; border-radius: 0 12px 12px 0; margin: 0 0 10px; color: var(--text2);
  }
  .md-body table { border-collapse: collapse; margin: 0 0 12px; font-size: 13.5px; display: block; overflow-x: auto; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
  .md-body th { background: var(--bg); font-weight: 600; }
  .md-body a { color: var(--accent); text-decoration: none; }
  .md-body a:hover { text-decoration: underline; }
  .md-body :not(pre) > code {
    background: var(--thinking-code-bg); color: var(--accent);
    padding: 2px 7px; border-radius: 7px; font-size: 0.88em;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  /* 代码块：语言标签 + 复制按钮（深色，ChatGPT 同款观感） */
  .codeblock { border-radius: 14px; overflow: hidden; margin: 0 0 12px; background: var(--code-bg); }
  .codeblock .code-head {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--code-head); color: #8b949e;
    padding: 7px 14px; font-size: 11.5px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .codeblock .copy-code {
    display: inline-flex; align-items: center; gap: 5px;
    border: none; background: none; color: #8b949e; cursor: pointer;
    font-size: 11.5px; font-family: inherit; padding: 2px 6px; border-radius: 6px;
    transition: all .15s ease;
  }
  .codeblock .copy-code:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
  .codeblock pre code {
    background: none; padding: 0; color: #e6edf3; font-size: 13px; line-height: 1.6;
    font-family: ui-monospace, "SF Mono", Consolas, Consolas, monospace;
  }
  .md-body > pre { background: var(--code-bg); border-radius: 14px; padding: 14px 16px; overflow-x: auto; margin: 0 0 12px; }
  .md-body > pre code { background: none; color: #e6edf3; font-size: 13px; }

  /* 消息操作条（hover 浮现）：复制 / 重新生成 */
  .msg-actions {
    display: flex; gap: 2px; margin-top: 6px; opacity: 0; transition: opacity .15s ease;
  }
  .msg.ai:hover .msg-actions { opacity: 1; }
  .msg-actions button {
    display: inline-flex; align-items: center; gap: 5px;
    border: none; background: none; color: var(--text2); cursor: pointer;
    font-size: 12px; font-family: inherit; padding: 5px 10px; border-radius: 9px;
    transition: all .15s ease;
  }
  .msg-actions button:hover { background: var(--bg); color: var(--accent); }
  .msg-actions button svg.icon { font-size: 13px; }
  .msg-actions button.copied { color: var(--green); }

  /* ===== 登录遮罩 + 骨架菜单（DevHub 宿主） ===== */
  /* ===== 宿主业务页（哈希路由） ===== */
  #pageHost { display: none; flex: 1; min-width: 0; flex-direction: column; background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 22px 26px; overflow-y: auto; }
  #pageHost.show { display: flex; }
  .pg-title { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
  .pg-sub { font-size: 12.5px; color: var(--text2); margin-bottom: 16px; }
  .pg-toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .pg-toolbar input, .pg-toolbar select { padding: 8px 14px; border: 1px solid var(--input-border); border-radius: 10px; background: var(--card); color: var(--text); font-size: 13px; font-family: inherit; outline: none; }
  .pg-btn { padding: 8px 16px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 500; }
  .pg-btn:hover { background: var(--accent-h); }
  .pg-btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--input-border); }
  .pg-btn.danger { background: rgba(255,59,48,.12); color: var(--red); }
  table.pg { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.pg th { text-align: left; color: var(--text2); font-weight: 600; font-size: 12px; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.pg td { padding: 10px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  table.pg tr:hover td { background: var(--thinking-bg); }
  .pg-pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 14px; font-size: 12.5px; color: var(--text2); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 980px; font-size: 11.5px; font-weight: 600; }
  .b-TODO { background: rgba(255,149,0,.14); color: #ff9500; } .b-DOING { background: rgba(0,113,227,.12); color: var(--accent); } .b-DONE { background: var(--green-bg); color: var(--green); }
  .b-OPEN { background: rgba(255,59,48,.12); color: var(--red); } .b-FIXED { background: rgba(0,113,227,.12); color: var(--accent); } .b-CLOSED { background: var(--green-bg); color: var(--green); }

/* ---------- Markdown 渲染管线（marked + DOMPurify + hljs，CDN 失败降级纯文本） ---------- */
const MD_READY = !!(window.marked && window.DOMPurify);
if (MD_READY) { marked.setOptions({ breaks: true, gfm: true }); }

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderMarkdown(text) {
  if (!MD_READY) {
    return `<div class="md-plain">${escapeHtml(text || '')}</div>`;
  }
  // 流式中间态：补齐未闭合的代码围栏，避免整段文本被吞进代码块闪烁
  let balanced = text || '';
  const fences = (balanced.match(/```/g) || []).length;
  if (fences % 2 === 1) balanced += '\n```';
  let html = marked.parse(balanced);
  html = DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
  return html;
}

/* 渲染后处理：行内引用 [n] 上标化（跳过代码块，只处理文本节点） */
function linkifyNode(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentElement.closest('pre, code') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT)
  });
  const targets = [];
  while (walker.nextNode()) {
    if (/\[\d+\]/.test(walker.currentNode.textContent)) targets.push(walker.currentNode);
  }
  targets.forEach(node => {
    const frag = document.createElement('span');
    frag.innerHTML = escapeHtml(node.textContent).replace(/\[(\d+)\]/g,
      (m, n) => `<sup class="cite" data-cite="${n}">${n}</sup>`);
    node.replaceWith(...frag.childNodes);
  });
}

/* 代码块增强：语言标签 + 复制按钮 + 语法高亮 */
function enhanceCodeBlocks(scope) {
  (scope || document).querySelectorAll('pre').forEach(pre => {
    if (pre.closest('.codeblock')) return;
    const code = pre.querySelector('code');
    const lang = (code && (code.className.match(/language-([\w+-]+)/) || [])[1]) || 'text';
    if (code && window.hljs) { try { hljs.highlightElement(code); } catch (e) { /* 忽略高亮失败 */ } }
    const box = document.createElement('div');
    box.className = 'codeblock';
    box.innerHTML = `<div class="code-head"><span>${escapeHtml(lang)}</span>
      <button class="copy-code">${icon('copy')}复制</button></div>`;
    pre.replaceWith(box);
    box.appendChild(pre);
    box.querySelector('.copy-code').onclick = ev => {
      copyText(pre.textContent).then(ok => {
        const btn = ev.currentTarget;
        btn.innerHTML = ok ? icon('check') + '已复制' : icon('copy') + '复制';
        setTimeout(() => { btn.innerHTML = icon('copy') + '复制'; }, 1500);
      });
    };
  });
}

/* 最终渲染：markdown + 引用上标 + 代码块增强 */
function renderAnswer(bubble, rawText) {
  bubble.innerHTML = renderMarkdown(rawText);
  bubble.classList.add('md-body');
  linkifyNode(bubble);
  enhanceCodeBlocks(bubble);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { }
  ta.remove();
  return ok;
}

/* 分页器：页码（带省略号）+ 上下页 + 跳转 */
function pageList(current, pages) {
  if (pages <= 7) return Array.from({ length: pages }, (_, i) => i + 1);
  const set = new Set([1, 2, current - 1, current, current + 1, pages - 1, pages]
      .filter(p => p >= 1 && p <= pages));
  const list = [...set].sort((a, b) => a - b);
  const result = [];
  list.forEach((p, i) => {
    if (i > 0 && p - list[i - 1] > 1) result.push('...');
    result.push(p);
  });
  return result;
}

function renderPager() {
  const { page, pages } = docState;
  if (pages <= 1) { $('pager').innerHTML = ''; return; }

  let html = `<button class="pg-btn nav" ${page <= 1 ? 'disabled' : ''} onclick="loadDocuments(${page - 1})">${icon('chevL')}</button>`;
  pageList(page, pages).forEach(p => {
    html += p === '...' ? `<span class="pg-dots">…</span>`
        : `<button class="pg-btn ${p === page ? 'active' : ''}" onclick="loadDocuments(${p})">${p}</button>`;
  });
  html += `<button class="pg-btn nav" ${page >= pages ? 'disabled' : ''} onclick="loadDocuments(${page + 1})">${icon('chevR')}</button>`;
  html += `<span class="pg-jump">跳至 <input id="jumpInput" type="number" min="1" max="${pages}" value="${page}"> 页
           <button onclick="jumpPage()">Go</button></span>`;
  $('pager').innerHTML = html;
}

function jumpPage() {
  const input = $('jumpInput');
  const target = parseInt(input.value, 10);
  if (isNaN(target)) return;
  const clamped = Math.max(1, Math.min(docState.pages, target));
  loadDocuments(clamped);
}

/* ---------- 发送主流程（含停止/流式渲染/追问建议） ---------- */
function setSendState(mode) {
  const btn = $('send');
  if (mode === 'stop') {
    btn.classList.add('stop');
    btn.disabled = false;
    btn.innerHTML = icon('stop');
    btn.title = '停止生成';
  } else {
    btn.classList.remove('stop');
    btn.disabled = false;
    btn.innerHTML = icon('arrowUp');
    btn.title = '发送';
  }
}

async function send() {
  const text = $('input').value.trim();
  if (!text || streaming) return;
  streaming = true;
  lastQuestion = text;
  $('input').value = '';
  autoGrow();

  appendBubble('user', text);
  const aiDiv = appendBubble('ai', '');
  const bubble = aiDiv.querySelector('.bubble');
  let raw = '';

  /* 思考态：三点脉动 + 秒表 */
  bubble.innerHTML = `<div class="thinking-ind"><span class="dots"><i></i><i></i><i></i></span><span class="tsec">思考中 · 0s</span></div>`;
  const t0 = Date.now();
  const timer = setInterval(() => {
    const el = aiDiv.querySelector('.tsec');
    if (el) el.textContent = `思考中 · ${Math.round((Date.now() - t0) / 1000)}s`;
  }, 1000);

  /* 停止生成：发送键变停止键 */
  currentAbort = new AbortController();
  setSendState('stop');
  let first = true;
  let renderTick = 0;
  let pendingRender = null;

  const finish = () => {
    clearInterval(timer);
    if (pendingRender) { clearTimeout(pendingRender); pendingRender = null; }
    streaming = false;
    currentAbort = null;
    setSendState('send');
  };

  try {
    const res = await fetch('/api/v1/chat/stream', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' },
        AUTH.token ? { 'Authorization': 'Bearer ' + AUTH.token } : {}),
      body: JSON.stringify({
        conversationId,
        message: text,
        enableRag: $('enableRag').checked,
        modelOptions: { model: $('modelSelect').value }
      }),
      signal: currentAbort.signal
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop();
      for (const evt of events) {
        const dataLine = evt.split('\n').find(l => l.startsWith('data:'));
        if (!dataLine) continue;
        const data = dataLine.slice(5);
        if (data === '[DONE]') continue;
        if (data.startsWith('__META__')) {
          const meta = JSON.parse(data.slice(8));
          conversationId = meta.conversationId;
          lastSources = meta.sources || [];
          appendSources(aiDiv, meta.sources);
          appendThinking(aiDiv, meta.thinkingSteps);
        } else {
          if (first) { first = false; }
          raw += data;
          /* 流式 Markdown：150ms 节流重渲染 + 补围栏，避免闪烁 */
          if (!pendingRender) {
            pendingRender = setTimeout(() => {
              pendingRender = null;
              bubble.innerHTML = renderMarkdown(raw) + '<span class="cursor"></span>';
              bubble.classList.add('md-body');
              $('messages').scrollTop = $('messages').scrollHeight;
            }, 150);
          }
        }
      }
    }
    clearInterval(timer);
    if (pendingRender) { clearTimeout(pendingRender); pendingRender = null; }
    if (!raw) raw = '（未返回内容）';
    renderAnswer(bubble, raw);
    aiDiv._raw = raw;
    appendActions(aiDiv, () => aiDiv._raw || raw);
    const topSrc = lastSources[0];
    if (topSrc && topSrc.fileName) appendFollowUps(aiDiv, topSrc.fileName);
    loadConversations();
  } catch (e) {
    clearInterval(timer);
    if (e.name === 'AbortError') {
      renderAnswer(bubble, (raw || '') + '\n\n*（已停止生成）*');
      aiDiv._raw = raw;
      appendActions(aiDiv, () => aiDiv._raw || '');
    } else {
      bubble.classList.add('md-plain');
      bubble.textContent = '请求失败：' + e.message;
    }
  }
  finish();
}

$('send').onclick = () => {
  if (streaming && currentAbort) { currentAbort.abort(); return; }
  send();
};

function openModal(title, fieldsHtml, onSubmit) {

    <div class="mbtns"><button class="pg-btn ghost" onclick="closeModal()">取消</button>

function fieldHtml(f, val) {
  val = val == null ? '' : val;
  if (f.type === 'select') {
    const opts = (typeof f.options === 'string' ? (DICTS[f.options] || []) : f.options)
      .map(o => `<option value="${esc(o.value)}" ${String(val) === String(o.value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('');
    return `<label>${esc(f.label)}</label><select name="${f.key}">${opts}</select>`;
  }
  if (f.type === 'textarea') return `<label>${esc(f.label)}</label><textarea name="${f.key}">${esc(val)}</textarea>`;
  if (f.type === 'date') return `<label>${esc(f.label)}</label><input type="date" name="${f.key}" value="${esc(val)}">`;
  return `<label>${esc(f.label)}</label><input name="${f.key}" value="${esc(val)}" placeholder="${esc(f.ph || '')}">`;
}

// ---------- 通用 CRUD 页 ----------
function crudPage(cfg) {
  const state = { page: 1, size: 10, filters: {} };
  return async function render(host) {
    host.innerHTML = `<div class="pg-title">${esc(cfg.title)}</div><div class="pg-sub">${esc(cfg.sub || '')}</div><div class="pg-toolbar" id="pgTb"></div><div id="pgBody">加载中…</div><div class="pg-pager" id="pgPager"></div>`;
    const tb = $('pgTb');
    // 过滤器 + 新建按钮
    let th = '';
    (cfg.filters || []).forEach(f => {
      if (f.type === 'select') {
        const opts = (typeof f.options === 'string' ? (DICTS[f.options] || []) : f.options)
          .map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
        th += `<select id="f_${f.key}"><option value="">${esc(f.label)}：全部</option>${opts}</select>`;
      } else {
        th += `<input id="f_${f.key}" placeholder="${esc(f.ph || f.label)}">`;
      }
    });
    th += `<button class="pg-btn" id="pgNew">${esc(cfg.newLabel || '新建')}</button>`;
    if (cfg.api === '/api/tasks') th += `<button class="pg-btn ghost" id="pgBoard">看板视图</button>`;
    tb.innerHTML = th;
    const boardBtn = $('pgBoard');
    if (boardBtn) boardBtn.onclick = () => renderBoardView(host, cfg);
    (cfg.filters || []).forEach(f => {
      const el = $('f_' + f.key);
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'keydown', ev => {
        if (ev.type === 'keydown' && ev.key !== 'Enter') return;
        state.filters[f.key] = el.value; state.page = 1; loadBody();
      });
    });
    $('pgNew').onclick = () => openForm(null);
    if (cfg.extra) await cfg.extra(host);

    async function loadBody() {
      const qs = new URLSearchParams({ page: state.page, size: state.size });
      Object.entries(state.filters).forEach(([k, v]) => { if (v) qs.set(k, v); });
      let d;
      try { d = await api(`${cfg.api}?${qs}`); } catch (e) { $('pgBody').innerHTML = `<div style="color:var(--red)">${esc(e.message)}</div>`; return; }
      const rows = d.records || [];
      if (!rows.length) { $('pgBody').innerHTML = '<div style="color:var(--text2);padding:20px;text-align:center">暂无数据</div>'; }
      else {
        let h = '<table class="pg"><tr>' + cfg.columns.map(c => `<th>${esc(c.title)}</th>`).join('') + '<th style="width:140px">操作</th></tr>';
        rows.forEach(r => {
          h += '<tr>' + cfg.columns.map(c => `<td>${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('');
          const acts = (cfg.rowActions ? cfg.rowActions(r) : ['edit', 'del']).map(a => {
            if (a === 'edit') return `<button class="rowact" onclick="PG.edit(${r.id})">编辑</button>`;
            if (a === 'del') return `<button class="rowact warn" onclick="PG.del(${r.id})">删除</button>`;
            return a;
          }).join('');
          h += `<td>${acts}</td></tr>`;
        });
        $('pgBody').innerHTML = h + '</table>';
      }
      const pages = Math.max(1, Math.ceil((d.total || 0) / state.size));
      $('pgPager').innerHTML = `<button class="pg-btn ghost" ${state.page <= 1 ? 'disabled' : ''} onclick="PG.go(${state.page - 1})">上一页</button>
        <span>${state.page} / ${pages}（共 ${d.total || 0} 条）</span>
        <button class="pg-btn ghost" ${state.page >= pages ? 'disabled' : ''} onclick="PG.go(${state.page + 1})">下一页</button>`;
    }

    window.PG = {
      go: p => { state.page = p; loadBody(); },
      edit: id => { const row = lastRows.find(r => r.id === id); if (row) openForm(row); },
      del: async id => { if (!confirm('确认删除？')) return; try { await api(cfg.api + '/' + id, { method: 'DELETE' }); loadBody(); } catch (e) { alert(e.message); } }
    };
    let lastRows = [];
    const _load = loadBody;
    loadBody = async function () { await _load(); lastRows = ((await api(buildQs())) || {records:[]}).records || lastRows; };
    function buildQs() { return cfg.api; } // 简化：edit 用最近一次表格数据
    // 更稳做法：渲染时缓存 rows
    const origLoad = loadBody;
    loadBody = async function () {
      const qs = new URLSearchParams({ page: state.page, size: state.size });
      Object.entries(state.filters).forEach(([k, v]) => { if (v) qs.set(k, v); });
      let d; try { d = await api(`${cfg.api}?${qs}`); } catch (e) { $('pgBody').innerHTML = `<div style="color:var(--red)">${esc(e.message)}</div>`; return; }
      lastRows = d.records || [];
      // 复用原渲染
      if (!lastRows.length) { $('pgBody').innerHTML = '<div style="color:var(--text2);padding:20px;text-align:center">暂无数据</div>'; }
      else {
        let h = '<table class="pg"><tr>' + cfg.columns.map(c => `<th>${esc(c.title)}</th>`).join('') + '<th style="width:150px">操作</th></tr>';
        lastRows.forEach(r => {
          h += '<tr>' + cfg.columns.map(c => `<td>${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('');
          const acts = (cfg.rowActions ? cfg.rowActions(r) : ['edit', 'del']).map(a => {
            if (a === 'edit') return `<button class="rowact" onclick="PG.edit(${r.id})">编辑</button>`;
            if (a === 'del') return `<button class="rowact warn" onclick="PG.del(${r.id})">删除</button>`;
            return a;
          }).join('');
          h += `<td>${acts}</td></tr>`;
        });
        $('pgBody').innerHTML = h + '</table>';
      }
      const pages = Math.max(1, Math.ceil((d.total || 0) / state.size));
      $('pgPager').innerHTML = `<button class="pg-btn ghost" ${state.page <= 1 ? 'disabled' : ''} onclick="PG.go(${state.page - 1})">上一页</button>
        <span>${state.page} / ${pages}（共 ${d.total || 0} 条）</span>
        <button class="pg-btn ghost" ${state.page >= pages ? 'disabled' : ''} onclick="PG.go(${state.page + 1})">下一页</button>`;
    };

    function openForm(row) {
      const fields = cfg.form.map(f => fieldHtml(f, row ? row[f.key] : f.def)).join('');
      openModal((row ? '编辑' : '新建') + cfg.title.slice(0, 2), fields, async data => {
        try {
          if (row) await api(cfg.api + '/' + row.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
          else await api(cfg.api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
          loadBody(); return true;
        } catch (e) { alert(e.message); return false; }
      });
    }
    loadBody();
  };
}

async function renderBoardView(host, cfg) {

  const cols = [['TODO','待办'], ['DOING','进行中'], ['DONE','已完成']];
  $('kbWrap').innerHTML = cols.map(([st, name]) => `
    <div class="kbcol" data-st="${st}" style="background:var(--bg);border-radius:16px;padding:12px;min-height:200px">

          <div class="kbcard" draggable="true" data-id="${t.id}" style="background:var(--card);border-radius:12px;padding:10px 12px;font-size:12.5px;cursor:grab;border:0.5px solid var(--border)">
            <div style="font-weight:500;margin-bottom:4px">${esc(t.title)}</div>

      </div>
    </div>`).join('');
  let dragId = null;
  document.querySelectorAll('.kbcard').forEach(card => {
    card.addEventListener('dragstart', e => { dragId = card.dataset.id; card.style.opacity = .4; });
    card.addEventListener('dragend', () => { card.style.opacity = 1; });

  document.querySelectorAll('.kbcol').forEach(col => {

      const toStatus = col.dataset.st;
      try { await api(`/api/tasks/${dragId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: toStatus }) }); }

async function renderOps(host) {

  try {
    const gaps = await api('/api/v1/knowledge/gaps?status=open');

      : '<div style="color:var(--text2);font-size:12.5px;padding:10px 0">暂无开放缺口</div>';
  } catch (e) { $('opGaps').innerHTML = `<div style="color:var(--red);font-size:12.5px">无权限（${esc(e.message)}）</div>`; }
  window.OPGEN = async (id, btn) => {
    btn.disabled = true; btn.textContent = '生成中…';
    try { const msg = await api(`/api/v1/knowledge/gaps/${id}/generate`, { method: 'POST' }); alert(msg); renderPage('/ai/ops'); }
    catch (e) { alert('生成失败：' + e.message); btn.disabled = false; btn.textContent = '生成草稿'; }

  try {

    $('opDocs').innerHTML = pending.length

          <button class="rowact warn" onclick="OPRV('${d.id}', false, this)">拒绝</button></td></tr>`).join('') + '</table>'
      : '<div style="color:var(--text2);font-size:12.5px;padding:10px 0">暂无待审核</div>';
    const off = (docs.records || []).filter(d => ['disabled', 'retired', 'superseded'].includes(d.lifeStatus));
    $('opDisabled').innerHTML = off.length
      ? `<table class="pg"><tr><th>文档</th><th>状态</th><th>命中</th></tr>` +

    try { await api(`/api/v1/knowledge/${id}/review?approve=${ok}`, { method: 'POST' }); renderPage('/ai/ops'); }
    catch (e) { alert(e.message); }
  };
}

// ---------- 文档中心 ----------
async function renderDocCenter(host) {
  host.innerHTML = `<div class="pg-title">文档中心</div><div class="pg-sub">分类管理 · 解析状态 · 审核发布 —— 发布后的文档自动进入 AI 知识库（Tika 解析 → 切片 → 向量化）</div>
    <div class="pg-toolbar"><select id="dcCat"></select><select id="dcAudit"><option value="">审核：全部</option><option value="PENDING">待审核</option><option value="PUBLISHED">已发布</option><option value="REJECTED">已驳回</option></select>
    <input type="file" id="dcFile" hidden><button class="pg-btn" id="dcUpload">上传文档</button><button class="pg-btn ghost" id="dcNewCat">新建分类</button></div>
    <div id="dcBody"></div><div class="pg-pager" id="dcPager"></div>`;
  let cats = []; try { cats = await api('/api/doc/categories'); } catch (e) {}
  $('dcCat').innerHTML = '<option value="">分类：全部</option>' + cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('dcNewCat').onclick = () => openModal('新建分类', fieldHtml({ key: 'name', label: '分类名' }) + fieldHtml({ key: 'sort', label: '排序', def: '0' }), async data => {
    try { await api('/api/doc/categories', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); renderPage('/doc'); return true; } catch (e) { alert(e.message); return false; }
  });
  $('dcUpload').onclick = () => $('dcFile').click();
  $('dcFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const fd = new FormData(); fd.append('file', f);
    if ($('dcCat').value) fd.append('categoryId', $('dcCat').value);
    $('dcUpload').textContent = '提交中…'; $('dcUpload').disabled = true;
    try {
      await api('/api/v1/documents/upload', { method: 'POST', body: fd });
      loadDocs();
      // 异步解析：轮询直到状态离开 processing（最长 90s）
      let n = 0;
      const timer = setInterval(async () => {
        n++;
        let d; try { d = await api('/api/doc/documents?auditStatus=PENDING&size=1'); } catch (e) { d = {records:[]}; }
        const stillProcessing = (d.records || []).some(r => r.id && r.status === 'processing');
        const mine = (d.records || []).find(r => r.fileName === f.name);
        if (mine && mine.status !== 'processing') {
          clearInterval(timer);
          alert(`解析完成：${mine.chunkCount} 个切片，待审核发布`);
          loadDocs();
        } else if (n > 18) { clearInterval(timer); }
        else loadDocs();
      }, 5000);
    }
    catch (err) { alert('上传失败：' + err.message); }
    $('dcUpload').textContent = '上传文档'; $('dcUpload').disabled = false; e.target.value = '';
  };
  const st = { page: 1 };
  ['dcCat', 'dcAudit'].forEach(id => $(id).addEventListener('change', () => { st.page = 1; loadDocs(); }));
  window.DCAUDIT = async (id, pass) => {
    try { await api(`/api/doc/documents/${id}/audit?pass=${pass}`, { method: 'POST' }); loadDocs(); } catch (e) { alert(e.message); }
  };
  async function loadDocs() {
    const qs = new URLSearchParams({ page: st.page, size: 10 });
    if ($('dcCat').value) qs.set('categoryId', $('dcCat').value);
    if ($('dcAudit').value) qs.set('auditStatus', $('dcAudit').value);
    let d; try { d = await api('/api/doc/documents?' + qs); } catch (e) { $('dcBody').innerHTML = `<div style="color:var(--red)">${esc(e.message)}</div>`; return; }
    $('dcBody').innerHTML = `<table class="pg"><tr><th>文件</th><th>分类</th><th>解析状态</th><th>切片数</th><th>上传人</th><th>审核</th><th>操作</th></tr>` +
      (d.records || []).map(r => `<tr>
        <td>${esc(r.fileName)}</td>
        <td>${esc((cats.find(c => c.id === r.categoryId) || {}).name || '-')}</td>
        <td>${r.status === 'processing' ? badge('DOING') : (r.status === 'completed' ? badge('DONE') : badge('OPEN'))}</td>
        <td>${r.chunkCount}</td>
        <td>${esc(r.uploader || '-')}</td>
        <td>${badge(r.auditStatus)}</td>
        <td>${r.auditStatus === 'PENDING' ? `<button class="rowact" onclick="DCAUDIT(${r.id ? "'" + r.id + "'" : "''"},true)">发布</button><button class="rowact warn" onclick="DCAUDIT('${r.id}',false)">驳回</button>` : ''}<button class="rowact" onclick="DCRIDX('${r.id}', this)">重建索引</button></td>
      </tr>`).join('') + '</table>';
    const pages = Math.max(1, Math.ceil((d.total || 0) / 10));
    $('dcPager').innerHTML = `<button class="pg-btn ghost" ${st.page <= 1 ? 'disabled' : ''} onclick="DCPG(${st.page - 1})">上一页</button><span>${st.page} / ${pages}</span><button class="pg-btn ghost" ${st.page >= pages ? 'disabled' : ''} onclick="DCPG(${st.page + 1})">下一页</button>`;
  }
  window.DCPG = p => { st.page = p; loadDocs(); };
  window.DCRIDX = async (id, btn) => {
    btn.disabled = true; const t = btn.textContent; btn.textContent = '重建中…';
    try { alert(await api('/api/doc/documents/' + id + '/reindex', { method: 'POST' })); }
    catch (e) { alert(e.message); }
    btn.disabled = false; btn.textContent = t;
  };
  loadDocs();
}

        '<input type="checkbox" name="m" value="' + m.id + '" ' + (mineIds.has(m.id) ? 'checked' : '') + ' style="width:auto">' +
        (m.parent_id ? '└ ' : '') + esc(m.name) +
        (m.perm ? ' <span style="color:var(--text2);font-size:11px">' + esc(m.perm) + '</span>' : '') + '</label>').join(''),
        async () => {
          const ids = [...document.querySelectorAll('#modalBox input[name=m]:checked')].map(c => Number(c.value));
          try { await api('/api/system/roles/' + rid + '/menus', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ menuIds: ids }) }); location.reload(); return true; }
          catch (e) { alert(e.message); return false; }
        });
    };
    loadRoles();

  // 用户表（管理员可见；普通用户只读）
  async function loadUsers() {
    let d; try { d = await api('/api/system/users?size=50' + ($('syKw').value ? '&keyword=' + encodeURIComponent($('syKw').value) : '')); } catch (e) { $('syUsers').innerHTML = ''; return; }
    $('syUsers').innerHTML = `<table class="pg"><tr><th>用户名</th><th>昵称</th><th>部门</th><th>角色</th><th>状态</th>${isAdmin ? '<th>操作</th>' : ''}</tr>` +
      (d.records || []).map(u => `<tr><td>${esc(u.username)}</td><td>${esc(u.nickname || '-')}</td><td>${esc(u.dept_name || '-')}</td>
        <td>${esc(u.roles || '-')}</td><td>${u.status === '0' ? badge('DONE') : badge('REJECTED')}</td>
        ${isAdmin ? `<td><button class="rowact" onclick="SYRP('${esc(u.username)}')">重置密码</button><button class="rowact warn" onclick="SYDEL('${esc(u.username)}')">删除</button></td>` : ''}</tr>`).join('') + '</table>';
  }
  $('syKw').addEventListener('keydown', e => { if (e.key === 'Enter') loadUsers(); });
  window.SYRP = u => openModal('重置密码：' + u, fieldHtml({ key: 'password', label: '新密码（≥6位）' }), async data => {
    try { await api(`/api/system/users/${u}/resetPwd`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); return true; } catch (e) { alert(e.message); return false; } });
  window.SYDEL = async u => { if (!confirm(`删除用户 ${u}？`)) return; try { await api(`/api/system/users/${u}`, { method: 'DELETE' }); loadUsers(); } catch (e) { alert(e.message); } };
  $('syNewUser').onclick = () => {
    let deptOpts = [];
    openModal('新建用户',
      fieldHtml({ key: 'username', label: '用户名' }) + fieldHtml({ key: 'password', label: '初始密码' }) +
      fieldHtml({ key: 'nickname', label: '昵称' }) +
      `<label>角色</label><select name="roleKey"><option value="USER">普通用户</option><option value="ADMIN">管理员</option></select>`,
      async data => {
        try { await api('/api/system/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); loadUsers(); return true; }
        catch (e) { alert(e.message); return false; } });
  };

  // 部门树
  try {
    const tree = await api('/api/system/depts');
    const flat = (ns, d) => ns.map(n => `<div style="padding-left:${d * 18}px;font-size:13px;padding:4px 0">${d > 0 ? '└ ' : ''}${esc(n.name)}</div>` + flat(n.children || [], d + 1)).join('');
    $('syDept').innerHTML = flat(tree, 0);
  } catch (e) { $('syDept').innerHTML = '<div style="color:var(--text2);font-size:12px">无权限</div>'; }

  // 字典
  $('syDict').innerHTML = Object.entries(DICTS).map(([k, vs]) =>
    `<div style="font-size:12px;margin:6px 0"><b>${esc(k)}</b>：${vs.map(v => esc(v.label)).join(' / ')}</div>`).join('');

  // 日志
  try {
    const lg = await api('/api/system/logs/oper?size=8');
    $('syLog').innerHTML = `<table class="pg"><tr><th>模块</th><th>动作</th><th>操作人</th><th>耗时</th><th>状态</th></tr>` +
      (lg.records || []).map(l => `<tr><td>${esc(l.module)}</td><td>${esc(l.action)}</td><td>${esc(l.username || '-')}</td><td>${l.costMs}ms</td><td>${l.status === 1 ? badge('DONE') : badge('OPEN')}</td></tr>`).join('') + '</table>';
  } catch (e) { $('syLog').innerHTML = '<div style="color:var(--text2);font-size:12px">无权限</div>'; }
  try {
    const ll = await api('/api/system/logs/login?size=8');
    $('syLoginLog').innerHTML = `<table class="pg"><tr><th>用户</th><th>IP</th><th>结果</th><th>时间</th></tr>` +
      (ll.records || []).map(l => `<tr><td>${esc(l.username)}</td><td>${esc(l.ip)}</td><td>${l.status === 1 ? badge('DONE') : badge('OPEN')}</td><td>${esc((l.createTime || '').replace('T', ' ').slice(5, 16))}</td></tr>`).join('') + '</table>';
  } catch (e) { $('syLoginLog').innerHTML = '<div style="color:var(--text2);font-size:12px">无权限</div>'; }

  loadUsers();
}

// ---------- 页面分发 ----------
async function renderPage(path) {
  const cfg = PAGES[path];
  const host = $('pageHost');
  if (!cfg) { host.innerHTML = `<div class="pg-title">${esc(path)}</div><div class="pg-sub">页面未实现（骨架占位）</div>`; return; }
  await loadOptions();
  if (cfg.render) return cfg.render(host);
  const c = { ...cfg.crud };
  // 动态下拉注入（项目/人员）
  (c.filters || []).forEach(f => { if (f.type === 'select' && Array.isArray(f.options) && !f.options.length) f.options = f.key === 'projectId' ? PROJECT_OPTS : USER_OPTS; });
  (c.form || []).forEach(f => { if (f.type === 'select' && Array.isArray(f.options) && !f.options.length) f.options = f.key === 'projectId' ? PROJECT_OPTS : USER_OPTS; });
  return crudPage(c)(host);
}

/* ---------- DevHub 登录态 ---------- */
$('loginLogo').innerHTML = icon('book');
$('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  $('loginErr').textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const j = await res.json();
    if (j.code !== 200) { $('loginErr').textContent = j.message || '登录失败'; return; }
    AUTH.token = j.data.token; AUTH.user = { username: j.data.username, menus: j.data.menus };
    localStorage.setItem('dh_token', AUTH.token);
    localStorage.setItem('dh_user', JSON.stringify(AUTH.user));
    enterApp();
  } catch (e) { $('loginErr').textContent = '网络异常：' + e.message; }
}

async function enterApp() {
  $('loginMask').classList.add('hidden');
  renderDhNav(); renderDhUser(); initSideToggle();
  await loadDicts();
  $('logoIcon').innerHTML = icon('book');
  loadModels(); loadConversations(); loadDocuments(1);
}

let NAVEL = null;
function renderDhNav() {
  const menus = (AUTH.user && AUTH.user.menus) || [];
  const byParent = {};
  menus.forEach(m => (byParent[m.parent_id || 0] = byParent[m.parent_id || 0] || []).push(m));
  const tops = (byParent[0] || []).sort((a, b) => a.sort - b.sort);
  const cur = location.hash.replace('#', '') || '/ai/chat';
  const html = tops.map(m => {
    const kids = (byParent[m.id] || []).sort((a, b) => a.sort - b.sort);
    const isCur = cur.startsWith(m.path || '\u0000');
    if (kids.length) {
      return `<div class="nvgroup${isCur ? ' open' : ''}">
        <div class="nvt" onclick="this.parentElement.classList.toggle('open')">${esc(m.name)}<span class="chev">▶</span></div>
        <div class="nvkids">${kids.map(k =>
          `<span class="nv${cur.startsWith(k.path) ? ' active' : ''}" onclick="navTo('${k.path}')">· ${esc(k.name)}</span>`).join('')}</div></div>`;
    }
    const target = m.id === 6 ? '/ai/chat' : (m.path || '/dashboard');
    return `<span class="nv leaf${cur.startsWith(m.path || '/none') && m.id !== 6 ? ' active' : (m.id === 6 && cur.startsWith('/ai') ? ' active' : '')}" onclick="navTo('${target}')">${esc(m.name)}</span>`;
  }).join('');
  if (!NAVEL) { NAVEL = document.createElement('div'); NAVEL.id = 'dhNav';
    document.querySelector('aside').insertBefore(NAVEL, document.querySelector('aside').firstChild); }
  NAVEL.innerHTML = html;
}

/* 抽屉收放 */
function initSideToggle() {
  $('sideToggle').innerHTML = '☰';
  $('sidePull').innerHTML = '☰';
  const aside = document.querySelector('aside');
  const sync = () => {
    const tucked = aside.classList.contains('tucked');
    $('sidePull').classList.toggle('show', tucked);
    localStorage.setItem('dh_tucked', tucked ? '1' : '');
  };
  $('sideToggle').onclick = () => { aside.classList.toggle('tucked'); sync(); };
  $('sidePull').onclick = () => { aside.classList.remove('tucked'); sync(); };
  if (localStorage.getItem('dh_tucked')) { aside.classList.add('tucked'); }
  sync();
}

function renderDhUser() {
  const box = document.createElement('div');
  box.id = 'dhUser';
  box.innerHTML = `<span class="u">${AUTH.user ? AUTH.user.username : ''}</span><button onclick="doLogout()">退出</button>`;
  const adminInput = document.getElementById('adminToken');
  adminInput && adminInput.replaceWith(box);
}

function doLogout() {
  localStorage.removeItem('dh_token'); localStorage.removeItem('dh_user');
  location.reload();
}

/* ---------- 初始化 ---------- */
$('messages').innerHTML = EMPTY_HTML;
if (AUTH.token) { enterApp().then(() => route()); } else { $('loginMask').classList.remove('hidden'); }
</script>
